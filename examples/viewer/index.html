<!DOCTYPE html>
<meta charset="utf-8">
<title>demo</title>
<link rel="icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHZpZXdCb3g9JzAgMCAzMiAzMic+PHJlY3Qgd2lkdGg9JzMyJyBoZWlnaHQ9JzMyJyByeD0nNycgZmlsbD0nIzE3MWEyMScvPjxjaXJjbGUgY3g9JzE2JyBjeT0nMTYnIHI9JzYuNScgZmlsbD0nIzc5YTZmNicvPjwvc3ZnPg==">
<link rel="stylesheet" href="./ui.css?v=4">
<!-- 结构说明:左栏=角色网格 + 表演场景列表(主入口) + 播放控制 + 折叠的动作库;
     中间=画面 + 状态条(状态条走文档流,画面上零浮层);右栏=旋钮(短、固定)。 -->
<div id="shell">

  <aside class="rail" id="railL">
    <div id="brand">
      <h1>demo</h1>
      <details class="note">
        <summary>规格</summary>
        <div class="body">toon 着色 · 眉眼透发(stencil)· 眨眼口型 · 布料实时物理 · S→L→E 段衔接 ·
          头顶气泡(emoticon)<br>规格:公开数据契约与运行时示例</div>
      </details>
    </div>

    <section class="group" id="gUnits">
      <h2>角色<span class="count" id="unitCount"></span></h2>
      <!-- 编号网格:31 个角色一屏全见,单击切换,当前项高亮 -->
      <div class="list ugrid" id="list" aria-label="角色列表"><div class="empty">载入中…</div></div>
    </section>

    <section class="group" id="gPerf">
      <h2>表演场景<span class="count" id="scnCount"></span></h2>
      <div class="controls">
        <button id="bAutoPerf" class="btn toggle on" type="button"
          title="空闲时按策略自动演出;手动点播的场景播放完毕后接续">自动演出</button>
        <select id="selPerfMode" class="field"
          title="自动演出的选取策略:按原始策略=源数据的时间门与概率(多数时间待机);轮播=依次播放每个场景">
          <option value="faithful">自动:按原始策略</option>
          <option value="cycle">自动:轮播</option>
        </select>
      </div>
      <div class="hintline dim" id="perfHint">&nbsp;</div>
      <div class="filter mt">
        <input id="scnFilter" class="field" type="search" placeholder="筛场景" aria-label="筛选表演场景">
      </div>
      <!-- 一行一个表演场景:点击=完整播放一遍(动作×表情×气泡),播完即停 -->
      <div class="list" id="scenarios" aria-label="表演场景列表"><div class="empty">载入中…</div></div>
    </section>

    <section class="group" id="gCtl">
      <h2>播放控制</h2>
      <div class="controls">
        <button id="bPlay" class="btn toggle on" type="button">暂停</button>
        <button id="bStop" class="btn" type="button" title="L 段 crossFade 0.5s 进 E 段">停止→E</button>
        <button id="bCloth" class="btn toggle on" type="button">物理</button>
        <button id="bClothReset" class="btn" type="button">重置物理</button>
      </div>
      <div class="controls" aria-label="相机模式">
        <span class="k">相机:<b id="cameraModeLabel">轨道</b></span>
        <button id="bCameraOrbit" class="btn toggle on" type="button">轨道</button>
        <button id="bCameraFree" class="btn toggle" type="button">自由</button>
      </div>
      <div id="cameraHint" class="hintline dim">拖拽旋转 · 滚轮缩放</div>
      <div class="controls">
        <label class="slider"><span class="k">速度</span>
          <input id="rSpeed" type="range" min="0" max="200" value="100" aria-label="播放速度">
          <output id="oSpeed">1.00×</output>
        </label>
      </div>
    </section>

  </aside>

  <main id="stage">
    <div id="view"></div>
    <div id="hud">
      <div id="status">载入中…</div>
      <div class="hint">拖拽旋转 · 滚轮缩放</div>
      <span id="phase" hidden>—</span>
    </div>
  </main>

  <aside class="rail" id="railR">
    <section class="group" id="gEnv">
      <h2>环境<span class="count" id="envCount"></span></h2>
      <!-- 15 个现象:图标网格,单击切换(0.25 秒交叉淡化);当前项高亮 -->
      <div class="list egrid" id="envList" aria-label="现象列表"><div class="empty">载入中…</div></div>
      <div class="hintline dim" id="envHint">&nbsp;</div>
      <div class="controls mt">
        <button id="bEnv" class="btn toggle" type="button"
          title="环境层:天空/光照/雾/云影/粒子/后处理(关掉回到默认外观)">环境层</button>
        <button id="bEnvIndoor" class="btn toggle" type="button"
          title="用带覆盖的那个站点(室内):配置与后处理走两级查找的第一级">室内覆盖</button>
      </div>
      <div class="controls">
        <button id="bEnvParticles" class="btn toggle on" type="button"
          title="现象粒子(天空族挂世界、相机族跟相机、站点族挂世界)">环境粒子</button>
        <button id="bEnvPost" class="btn toggle on" type="button"
          title="后处理链:粒子泛光 → 泛光 → 扩散 → 耀斑 → 白平衡 → 颜色调整 → 分离色调">后处理</button>
      </div>
      <div class="controls">
        <button id="bEnvSky" class="btn toggle on" type="button" title="天空可见性">天空</button>
        <button id="bEnvGround" class="btn toggle on" type="button" title="站点几何的可见性">站点</button>
      </div>
      <div class="controls">
        <select id="selEnvSite" class="field"
          title="换站点:真站点几何 + 站点粒子挂哪一站。**一行一个站点,不是一行一个场景包**:室内那一个场景包承载三个站点(1/2/3 楼),三行只差 placement 表给的世界位置。室内/室外由站点产物判(室内不挂天气特效与天空)"></select>
      </div>
      <!-- 室内等级:房间由套件按等级模块拼装。等级本身在 master 表里(本仓没有),
           所以做成面板下发,默认取产物里最高的一级。 -->
      <div class="controls">
        <select id="selEnvLevel" class="field"
          title="室内房间等级:房间 = 该级扩张模块摆出来的套件网格 + 该级的可走面。名单 = 产物里的扩张模块等级 ∩ placement 表里这一站开放的等级(2 楼与 3 楼只开放 5 级);当前是第几级由服务端决定,所以做成面板下发"></select>
      </div>
      <!-- 站点这一族八个程序**都写两个渲染目标**:第一个是颜色,第二个是发光。
           只有 Object 与 Fixture/Basic 会往第二个写非零值。这块缓冲与粒子特效缓冲相加后
           一起进泛光金字塔(真源里两者写同一块 effectRT),所以发光**经泛光那一路**进主目标;
           泛光那一支关着时它不进。 -->
      <div class="controls">
        <select id="selEnvEmission" class="field"
          title="站点的第二个渲染目标(发光):不产 / 每帧产一张缓冲 / 把缓冲直显到屏幕。产出态下它与粒子特效缓冲相加后经泛光进主目标;直显是查看手段,不是原版通路">
          <option value="off">发光缓冲:不产</option>
          <option value="buffer" selected>发光缓冲:产出</option>
          <option value="view">发光缓冲:直显</option>
        </select>
      </div>
      <div class="hintline dim" id="envSiteHint">&nbsp;</div>
      <!-- 现象时间轴:打雷天那一下亮就出自它(天空与光的附加色/附加强度)。
           暂停 + 拖时刻 = 定点观测同一拍。 -->
      <div class="controls">
        <button id="bEnvTimeline" class="btn toggle on" type="button"
          title="现象时间轴:按现象自己的时长循环播放(打雷天的闪光由它驱动);关掉 = 停在当前这一拍">时间轴</button>
        <button id="bEnvTimelineReset" class="btn" type="button" title="时间轴复位到 0 秒">复位</button>
      </div>
      <div class="controls">
        <label class="slider"><span class="k">时刻</span>
          <input id="rEnvTimeline" type="range" min="0" max="1000" value="0" aria-label="时间轴时刻">
          <output id="oEnvTimeline">—</output>
        </label>
      </div>
      <div class="hintline dim" id="envTlHint">&nbsp;</div>
    </section>

    <section class="group" id="gAudio">
      <h2>音频<span class="count" id="audioCount"></span></h2>
      <!-- 现象音频:按产物行的律路由(现象 bgms / siteSounds,站点底层 siteBgms /
           siteSoundFallbacks);循环点由产物直接给出。开关是真实播放手势。 -->
      <div class="controls">
        <button id="bAudio" class="btn toggle" type="button"
          title="现象音频:先选现象与站点,再点这里开(浏览器自动播放策略要求的第一次手势)">音频</button>
        <label class="slider"><span class="k">音量</span>
          <input id="rAudio" type="range" min="0" max="100" value="100" aria-label="音量">
          <output id="oAudio">100%</output>
        </label>
      </div>
      <div class="hintline dim" id="audioHint">&nbsp;</div>
    </section>

    <section class="group">
      <h2>外观与光照</h2>
      <div class="controls">
        <button id="bNight" class="btn toggle" type="button">夜间</button>
        <button id="bWire" class="btn toggle" type="button">线框</button>
      </div>
      <div class="controls">
        <select id="selDebug" class="field" title="着色诊断(定位色差属于哪一层)">
          <option value="0">着色:正常</option>
          <option value="1">诊断:无阴影</option>
          <option value="2">诊断:无球面影</option>
          <option value="3">诊断:分支可视化</option>
        </select>
      </div>
      <div class="stack mt">
        <label class="slider"><span class="k">方位</span>
          <input id="rLightXZ" type="range" min="0" max="360" value="48" title="方位角(默认 48°)" aria-label="光照方位角">
          <output id="oLightXZ">48°</output>
        </label>
        <label class="slider"><span class="k">仰角</span>
          <input id="rLightY" type="range" min="-10" max="89" value="30" title="仰角(默认 30°)" aria-label="光照仰角">
          <output id="oLightY">30°</output>
        </label>
        <div class="controls">
          <button id="bLightReset" class="btn" type="button" title="恢复默认 48°/30°">光复位</button>
        </div>
        <div class="hintline dim" id="lightHint">&nbsp;</div>
      </div>
    </section>

    <section class="group">
      <h2>表情与头顶件</h2>
      <div class="controls">
        <button id="bBlink" class="btn toggle on" type="button">眨眼</button>
        <button id="bSpeak" class="btn toggle" type="button">说话</button>
      </div>
      <!-- 眼口标签(表情表的行):选择即应用,眨眼/说话机取所选行的开合格;检查工具,选择时停用自动演出 -->
      <div class="controls">
        <select id="selEye" class="field" title="眼型标签(表情表行);选择即应用并停用自动演出,眨眼取所选行的开/闭格"></select>
        <select id="selMouth" class="field" title="口型标签(表情表行);选择即应用并停用自动演出,说话取所选行的开/闭格"></select>
      </div>
      <div class="stack mt">
        <!-- 53 个头顶件:输入即定位(不删 option,因为外部探针按 selEmoticon.value 直接指名) -->
        <input id="emoFilter" class="field" type="search" placeholder="定位头顶件(↵ 下一个)" aria-label="定位头顶件">
        <div id="emoMatch" class="hintline dim">&nbsp;</div>
        <select id="selEmoticon" class="field"
          title="fx_emote_* 条目(sprite=图集动画 view,particle=粒子 view)"></select>
        <div class="controls">
          <button id="bEmoticonPlay" class="btn" type="button"
            title="手动挂选中条目(不自动收,点「收件」走 end 段收场)">播件</button>
          <button id="bEmoticonHide" class="btn" type="button"
            title="收场:loopEnd→end 段,再等 disposeDelaySeconds 回收">收件</button>
          <button id="bEmoticonAuto" class="btn toggle on" type="button"
            title="编排里的 emoticon/hideEmoticon 步驱动头顶件(showSeconds 到点自动收);关掉只留手动">自动</button>
        </div>
      </div>
    </section>

    <details class="group" id="gMotion">
      <summary>动作库<span class="count" id="famCount"></span><span class="sub">仅动作,无表情/气泡配对</span></summary>
      <div class="hintline dim">点播供检查,期间自动演出停用;点行名=播全族(S→L),点小方块=只播那一段</div>
      <div class="filter mt">
        <input id="famFilter" class="field" type="search" placeholder="筛动作族" aria-label="筛选动作族">
      </div>
      <div class="list" id="clips" aria-label="动作族列表"><div class="empty">载入中…</div></div>
    </details>

    <section class="group">
      <details id="selfcheckPanel">
        <summary>诊断自检<span id="selfcheckSummary" class="dim">…</span></summary>
        <div id="selfcheck"></div>
        <div class="controls foot">
          <button id="bCheckMotion" class="btn" type="button"
            title="播一遍带 S/L 的探针动作族,让「动画推进」「段衔接」两项拿到可测的动作;默认不自动播,所以这两项要点了才有结论">复测动效</button>
        </div>
      </details>
    </section>
  </aside>

</div>

<script type="importmap">
{ "imports": { "three": "./three.module.min.js" } }
</script>
<script type="module" src="./viewer.js"></script>
