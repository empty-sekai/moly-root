[package]
name = "moly-shader-bridge"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
naga = { version = "=27.0.3", features = ["glsl-in", "glsl-out", "wgsl-in", "wgsl-out"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
opt-level = 2
strip = true
