[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moly-root"
version = "0.1.0"
description = "Character extraction and recompilation toolkit: Unity humanoid assets to glTF 2.0, without the Unity engine"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "UnityPy>=1.20",
]

[project.optional-dependencies]
fonts = ["fonttools>=4.60,<5"]
deployment = [
    "brotli>=1.2,<2",
    "oss2>=2.19,<3",
]
jp = [
    "msgpack>=1.0",
    "pycryptodome>=3.20",
]

[project.scripts]
moly = "cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pack = ["*.toml", "*.mjs", "*.schema.json"]

[tool.pytest.ini_options]
# Generated resource trees contain hundreds of thousands of non-test files.
# Only the shipped test suite participates in discovery.
testpaths = ["tests"]
